# Compiles the parts of LiveSimBooter that need no Apple runtime input or signing identity.
#
# Built here: the native host app and its LiveProcess extension (unsigned, arm64 iPhoneOS) and the guest
# tools for arm64-apple-ios-simulator.
# Not built here: the pinned 23A343 runtime staging, the shared-cache build/patch/sign pipeline, the native
# Metal backend (needs the original MTLSimImplementation/MetalSerializer images), Fish (needs the external
# Rust source), and anything that requires a team signing identity, provisioning profiles, or a device.
# See docs/ci-build.md.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native host (iPhoneOS arm64)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 toolchain
        run: |
          set -euo pipefail
          selected=
          for candidate in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V -r); do
            selected="$candidate/Contents/Developer"
            break
          done
          if [ -z "$selected" ]; then
            echo "::notice::No Xcode 26 bundle found; using the image default."
          else
            echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="$selected"
          fi
          xcodebuild -version
          major=$(xcodebuild -version | sed -n '1s/^Xcode \([0-9][0-9]*\).*/\1/p')
          if [ -z "$major" ] || [ "$major" -lt 26 ]; then
            echo "::error::An Xcode with the iOS 26 SDK is required (IPHONEOS_DEPLOYMENT_TARGET is 26.0)."
            exit 1
          fi
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build LiveSimBooter.app and LiveProcess.appex (unsigned)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-build"
          set -o pipefail
          xcodebuild -quiet \
            -project LiveSimBooter.xcodeproj -scheme LiveSimBooter \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/native-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee "$RUNNER_TEMP/native-build.log"
      - name: Package unsigned artifacts
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/native-build/Build/Products/Release-iphoneos/LiveSimBooter.app"
          extension="$app/PlugIns/LiveProcess.appex"
          if [ ! -d "$app" ] || [ ! -d "$extension" ]; then
            echo "::error::The build did not produce LiveSimBooter.app with an embedded LiveProcess.appex."
            find "$RUNNER_TEMP/native-build/Build/Products" -maxdepth 3 -name '*.app*' || true
            exit 1
          fi
          echo "Host:"; file "$app/LiveSimBooter"
          echo "Extension:"; file "$extension/LiveProcess"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$extension/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist" || true
          mkdir -p dist/Payload
          ditto "$app" dist/Payload/LiveSimBooter.app
          ditto -c -k --sequesterRsrc --keepParent dist/Payload dist/LiveSimBooter-unsigned.ipa
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/LiveSimBooter.app.zip
          {
            echo "commit $(git rev-parse HEAD)"
            echo "xcode $(xcodebuild -version | tr '\n' ' ')"
            echo "iphoneos_sdk $(xcrun --sdk iphoneos --show-sdk-version)"
            echo "iphonesimulator_sdk $(xcrun --sdk iphonesimulator --show-sdk-version)"
            echo "host $(file -b "$app/LiveSimBooter")"
            echo "extension $(file -b "$extension/LiveProcess")"
            echo "signed no (CODE_SIGNING_ALLOWED=NO)"
          } > dist/BUILD-INFO.txt
          cat dist/BUILD-INFO.txt
      - name: Upload unsigned native build
        uses: actions/upload-artifact@v4
        with:
          name: LiveSimBooter-unsigned
          path: dist/
          if-no-files-found: error
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: |
            ${{ runner.temp }}/native-build.log
            ${{ runner.temp }}/native-build/Build/Products/**
          if-no-files-found: warn

  guest:
    name: Guest tools (arm64 iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Build guest tools with the tracked scripts
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/guest"
          mkdir -p "$out"
          sh Tools/build-spawn-shim.sh "$out/libLiveSimSpawn.dylib" "$out/spawn-probe"
          sh Tools/build-terminal-fish.sh "$out"
          sh Tools/build-display-settings.sh "$out"
          sh Tools/build-launchctl-control.sh "$out"
          sh Tools/build-app-registration.sh "$out"
          sh Tools/build-core-services-probes.sh "$out"
          sh Tools/build-metal-iosurface-probe.sh "$out/metal-iosurface-probe"
          for binary in "$out"/*; do
            printf '%s: ' "$(basename "$binary")"
            file -b "$binary"
          done
          {
            echo "commit $(git rev-parse HEAD)"
            echo "xcode $(xcodebuild -version | tr '\n' ' ')"
            echo "iphonesimulator_sdk $(xcrun --sdk iphonesimulator --show-sdk-version)"
          } > "$out/BUILD-INFO.txt"
          cat "$out/BUILD-INFO.txt"
      - name: Upload guest tools
        uses: actions/upload-artifact@v4
        with:
          name: LiveSimBooter-guest-tools
          path: ${{ runner.temp }}/guest/
          if-no-files-found: error

  tests:
    name: Local suite (informational)
    runs-on: macos-26
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests/run.sh
        run: |
          set -uo pipefail
          sh Tests/run.sh > "$RUNNER_TEMP/tests.log" 2>&1
          status=$?
          tail -n 60 "$RUNNER_TEMP/tests.log"
          echo "Tests/run.sh exit status: $status"
          exit $status
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-log
          path: ${{ runner.temp }}/tests.log
          if-no-files-found: warn
